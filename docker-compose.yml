version: '3.8'

services:
  app:
    build: .
    container_name: image-backend-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    # For development with auto-reload:
    # command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    # For production:
    command: uvicorn main:app --host 0.0.0.0 --port 8000
