<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#101810"/>
      <stop offset="100%" style="stop-color:#172319"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Navbar -->
  <rect x="0" y="0" width="800" height="80" fill="#101810" stroke="#ffffff20" stroke-width="1"/>
  <text x="50" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#a7c957">DOCKER</text>
  <text x="130" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">.</text>
  <text x="700" y="50" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1dd3b0">● API Online</text>
  
  <!-- Hero Section -->
  <text x="100" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#affc41">✦ CONTAINERIZED IMAGE BACKEND</text>
  
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="#ffffff">Build once.</text>
  <text x="100" y="230" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="#a7c957">Run anywhere.</text>
  
  <text x="100" y="280" font-family="Arial, sans-serif" font-size="16" fill="#a5b5a2" line-height="1.6">
    <tspan x="100" dy="0">Welcome to your Image Backend API. Powered by Docker,</tspan>
    <tspan x="100" dy="24">built for consistency, scalability, and modern</tspan>
    <tspan x="100" dy="24">application development.</tspan>
  </text>
  
  <!-- Buttons -->
  <rect x="100" y="320" width="180" height="45" rx="9" fill="#a7c957"/>
  <text x="190" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#172319" text-anchor="middle">Explore API Docs →</text>
  
  <rect x="300" y="320" width="180" height="45" rx="9" fill="transparent" stroke="#ffffff30" stroke-width="1"/>
  <text x="390" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Discover Docker</text>
  
  <!-- Docker Icon -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="80">🐳</text>
  
  <!-- Terminal -->
  <rect x="550" y="250" width="200" height="120" rx="12" fill="#0b120d" stroke="#a7c95730" stroke-width="1"/>
  <text x="560" y="275" font-family="monospace" font-size="12" fill="#a5b5a2">● ● ● image-backend ~ terminal</text>
  <text x="560" y="295" font-family="monospace" font-size="12" fill="#1dd3b0">$ docker build -t image-api .</text>
  <text x="560" y="310" font-family="monospace" font-size="12" fill="#b2ff9e">✓ Image built successfully</text>
  <text x="560" y="325" font-family="monospace" font-size="12" fill="#1dd3b0">$ docker run -p 8000:8000 image-api</text>
  <text x="560" y="340" font-family="monospace" font-size="12" fill="#b2ff9e">✓ Application running</text>
  <text x="560" y="355" font-family="monospace" font-size="12" fill="#b2ff9e">Server: http://localhost:8000</text>
  
  <!-- Footer -->
  <rect x="0" y="550" width="800" height="50" fill="#101810" stroke="#ffffff12" stroke-width="1"/>
  <text x="100" y="575" font-family="Arial, sans-serif" font-size="12" fill="#a5b5a2">© 2026 Image Backend API</text>
  <text x="400" y="575" font-family="Arial, sans-serif" font-size="12" fill="#a5b5a2">Built with ❤️ using FastAPI & Docker</text>
  <text x="700" y="575" font-family="Arial, sans-serif" font-size="12" fill="#a5b5a2">Powered by Containers</text>
  
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Your API. Ready to go.</text>
</svg>
